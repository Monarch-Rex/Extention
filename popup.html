<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Element Scanner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap');

    :root {
      --bg: #0d0d0f;
      --surface: #141417;
      --border: #252529;
      --accent: #5dffb5;
      --accent2: #ff6b6b;
      --accent3: #7b8fff;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --badge-textbox: #5dffb5;
      --badge-button: #ff6b6b;
      --badge-dropdown: #7b8fff;
      --badge-checkbox: #ffd166;
      --badge-radio: #f97316;
      --badge-link: #38bdf8;
      --badge-file: #c084fc;
      --badge-slider: #fb7185;
      --badge-other: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 480px;
      min-height: 200px;
      max-height: 600px;
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      padding: 14px 16px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header .logo {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: grid; place-items: center;
      font-size: 14px;
    }
    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    header h1 span { color: var(--accent); }
    .badge-count {
      margin-left: auto;
      background: var(--accent);
      color: var(--bg);
      font-weight: 700;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      display: none;
    }

    /* ── Toolbar ── */
    .toolbar {
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    #scanBtn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 7px 16px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    #scanBtn:hover { opacity: 0.85; }
    #scanBtn:disabled { opacity: 0.4; cursor: not-allowed; }

    #copyBtn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      display: none;
    }
    #copyBtn:hover { border-color: var(--accent); color: var(--accent); }

    #filterInput {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      outline: none;
      transition: border-color 0.15s;
      display: none;
    }
    #filterInput:focus { border-color: var(--accent); }
    #filterInput::placeholder { color: var(--muted); }

    /* ── Results ── */
    #results {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    #results::-webkit-scrollbar { width: 4px; }
    #results::-webkit-scrollbar-track { background: transparent; }
    #results::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── State ── */
    .state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 32px 16px;
      color: var(--muted);
      text-align: center;
    }
    .state .icon { font-size: 28px; }
    .state p { font-size: 11px; line-height: 1.5; }

    /* ── Element Row ── */
    .el-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
      animation: fadeIn 0.15s ease forwards;
      opacity: 0;
    }
    .el-row:hover { background: var(--surface); }
    .el-row:last-child { border-bottom: none; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .type-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 1px;
      background: color-mix(in srgb, var(--badge-color) 15%, transparent);
      color: var(--badge-color);
      border: 1px solid color-mix(in srgb, var(--badge-color) 30%, transparent);
    }

    .el-detail { flex: 1; min-width: 0; }

    .el-line {
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .el-line .keyword { color: var(--accent3); }
    .el-line .identifier { color: var(--accent); }

    .el-meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .el-meta span { margin-right: 8px; }
    .el-meta .tag { 
      color: var(--muted);
      font-size: 10px;
    }
    .el-meta .label-val { 
      color: #a0a0b8; 
    }
    .required-dot {
      display: inline-block;
      width: 5px; height: 5px;
      background: var(--accent2);
      border-radius: 50%;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* ── Footer ── */
    footer {
      padding: 8px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">⬡</div>
    <h1>Element <span>Scanner</span></h1>
    <span class="badge-count" id="countBadge">0</span>
  </header>

  <div class="toolbar">
    <button id="scanBtn">▶ Scan Page</button>
    <input id="filterInput" type="text" placeholder="Filter elements…" />
    <button id="copyBtn">⎘ Copy</button>
  </div>

  <div id="results">
    <div class="state" id="emptyState">
      <div class="icon">⬡</div>
      <p>Press <strong>Scan Page</strong> to detect<br/>all interactive elements on this tab.</p>
    </div>
  </div>

  <footer>
    <span id="footerLeft">Interactive Element Scanner v1.0</span>
    <span id="footerRight"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
